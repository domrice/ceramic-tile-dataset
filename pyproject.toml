[project]
name = "tiles-dataset"
version = "1.0.0"
description = "Analysis figures for the physical mosaic tile dataset"
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.11",
    "matplotlib>=3.9",
    "numpy>=2.0",
]

[dependency-groups]
# the digitization pipeline: camera capture, YOLO + SAM2 segmentation, YOLO training
capture = [
    "sam-2",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "ultralytics==8.3.174",
    "opencv-python>=4.12.0.88",
    "scikit-image>=0.24",
    "pandas>=2.3.3",
    "pyyaml>=6.0",
    "requests>=2.32",
    "tqdm>=4.66.1",
]

[tool.uv.sources]
sam-2 = { git = "https://github.com/facebookresearch/sam2", rev = "2b90b9f5ceec907a1c18123530e92e794ad901a4" }

[tool.uv.extra-build-variables]
# the CUDA post-processing extension is optional and unused by the image predictor
sam-2 = { SAM2_BUILD_CUDA = "0" }
